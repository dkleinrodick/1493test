<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontier GoWild Flight Scraper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .form-group select:disabled {
            background: #f5f5f5;
            cursor: not-allowed;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .method-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .method-option {
            flex: 1;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
        }

        .method-option:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .method-option.selected {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .method-option input[type="radio"] {
            display: none;
        }

        .method-option .method-title {
            font-weight: 600;
            font-size: 1.1rem;
            margin-bottom: 5px;
        }

        .method-option .method-desc {
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .options-section {
            margin-top: 20px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .option-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .option-item label {
            cursor: pointer;
            margin: 0;
            font-weight: normal;
        }

        .option-help {
            color: #666;
            font-size: 0.85rem;
            margin-left: 30px;
            margin-top: 5px;
        }

        .proxy-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #ddd;
        }

        .search-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            margin-top: 20px;
        }

        .search-button:hover {
            transform: translateY(-2px);
        }

        .search-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .results-card.show {
            display: block;
        }

        .results-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .results-header h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .results-meta {
            color: #666;
            font-size: 0.9rem;
        }

        .flight-list {
            display: grid;
            gap: 15px;
        }

        .flight-card {
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
        }

        .flight-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .flight-time {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .time {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
        }

        .flight-arrow {
            color: #667eea;
            font-size: 1.2rem;
        }

        .flight-price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #667eea;
        }

        .flight-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            padding-top: 15px;
            border-top: 1px solid #e0e0e0;
        }

        .detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 4px;
        }

        .detail-value {
            font-weight: 600;
            color: #333;
        }

        .no-flights {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-flights-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .error-message {
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 8px;
            padding: 15px;
            color: #c33;
            margin-bottom: 20px;
        }

        .error-message strong {
            display: block;
            margin-bottom: 5px;
        }

        .loading {
            text-align: center;
            padding: 40px;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .cache-badge {
            display: inline-block;
            background: #ffa726;
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-left: 10px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .method-selector {
                flex-direction: column;
            }

            .flight-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .header h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✈️ Frontier GoWild Flight Scraper</h1>
            <p>Search for GoWild flight availability on valid Frontier routes</p>
        </div>

        <div class="search-card">
            <form id="searchForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="origin">Origin Airport</label>
                        <select id="origin" required disabled>
                            <option value="">Loading airports...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="destination">Destination Airport</label>
                        <select id="destination" required disabled>
                            <option value="">First select origin...</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="date">Departure Date</label>
                    <input type="date" id="date" required>
                </div>

                <div class="form-group">
                    <label>Scraping Method</label>
                    <div class="method-selector">
                        <label class="method-option selected">
                            <input type="radio" name="method" value="api" checked>
                            <div class="method-title">Scrapfly API</div>
                            <div class="method-desc">Most reliable (recommended)</div>
                        </label>
                        <label class="method-option">
                            <input type="radio" name="method" value="direct">
                            <div class="method-title">Direct Scraping</div>
                            <div class="method-desc">Uses Playwright + proxies</div>
                        </label>
                    </div>
                </div>

                <div class="options-section">
                    <div class="option-item">
                        <input type="checkbox" id="useCache" checked>
                        <label for="useCache">Use cached data (6-hour cache)</label>
                    </div>

                    <div id="proxyOptions" class="proxy-section" style="display: none;">
                        <div class="option-item">
                            <input type="checkbox" id="useProxies">
                            <label for="useProxies">🌐 Use Proxy Rotation</label>
                        </div>
                        <div class="option-help">
                            Automatically tries different proxies if bot detection is triggered
                        </div>
                    </div>
                </div>

                <div class="form-row" style="gap: 10px;">
                    <button type="submit" class="search-button" id="searchButton">
                        Search Single Route
                    </button>
                    <button type="button" class="search-button bulk-button" id="bulkSearchButton" style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);">
                        Search All Routes from Origin
                    </button>
                </div>
            </form>
        </div>

        <div class="results-card" id="resultsCard">
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        // Global data
        let airportsData = {};
        let routesData = {};

        // Initialize on page load
        (async function init() {
            console.log('🚀 Initializing Frontier GoWild Scraper...');

            try {
                // Load both airports and routes in parallel
                const [airportsResponse, routesResponse] = await Promise.all([
                    fetch('/api/airports'),
                    fetch('/api/routes')
                ]);

                airportsData = await airportsResponse.json();
                routesData = await routesResponse.json();

                console.log(`✓ Loaded ${Object.keys(airportsData).length} airports`);
                console.log(`✓ Loaded routes for ${Object.keys(routesData).length} origins`);

                // Populate origin dropdown
                populateOriginDropdown();

                console.log('✓ App ready!');
            } catch (error) {
                console.error('Failed to initialize:', error);
                alert('Failed to load airport data. Please refresh the page.');
            }
        })();

        // Populate origin dropdown with all airports sorted by city
        function populateOriginDropdown() {
            const originSelect = document.getElementById('origin');

            // Sort airports by city name
            const sortedAirports = Object.entries(airportsData).sort((a, b) => {
                return a[1].localeCompare(b[1]);
            });

            // Clear loading message
            originSelect.innerHTML = '<option value="">Select origin airport...</option>';

            // Add all airports
            sortedAirports.forEach(([code, city]) => {
                const option = document.createElement('option');
                option.value = code;
                option.textContent = `${city} (${code})`;
                originSelect.appendChild(option);
            });

            // Enable dropdown
            originSelect.disabled = false;

            // Add change listener
            originSelect.addEventListener('change', onOriginChange);
        }

        // Handle origin selection change
        function onOriginChange(event) {
            const destSelect = document.getElementById('destination');
            const selectedOrigin = event.target.value;

            if (!selectedOrigin) {
                // No origin selected
                destSelect.innerHTML = '<option value="">First select origin...</option>';
                destSelect.disabled = true;
                return;
            }

            // Get valid destinations for this origin
            const validDestinations = routesData[selectedOrigin] || [];

            if (validDestinations.length === 0) {
                // No routes for this origin
                destSelect.innerHTML = `<option value="">No known routes from ${selectedOrigin}</option>`;
                destSelect.disabled = true;
                console.warn(`No routes found for origin: ${selectedOrigin}`);
                return;
            }

            // Populate destinations
            destSelect.innerHTML = '<option value="">Select destination...</option>';

            // Sort destinations by city name
            const sortedDests = validDestinations
                .map(code => ({
                    code: code,
                    city: airportsData[code] || code
                }))
                .sort((a, b) => a.city.localeCompare(b.city));

            sortedDests.forEach(dest => {
                const option = document.createElement('option');
                option.value = dest.code;
                option.textContent = `${dest.city} (${dest.code})`;
                destSelect.appendChild(option);
            });

            // Enable destination dropdown
            destSelect.disabled = false;

            console.log(`✓ Loaded ${validDestinations.length} destinations for ${selectedOrigin}`);
        }

        // Set minimum date to today
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.min = today;
        dateInput.value = today;

        // Method selector toggle
        document.querySelectorAll('.method-option').forEach(option => {
            option.addEventListener('click', function() {
                document.querySelectorAll('.method-option').forEach(opt => {
                    opt.classList.remove('selected');
                });
                this.classList.add('selected');
                this.querySelector('input[type="radio"]').checked = true;

                // Show/hide proxy options based on method
                const selectedMethod = this.querySelector('input[type="radio"]').value;
                const proxyOptions = document.getElementById('proxyOptions');

                if (selectedMethod === 'direct') {
                    proxyOptions.style.display = 'block';
                } else {
                    proxyOptions.style.display = 'none';
                }
            });
        });

        // Bulk search button handler
        document.getElementById('bulkSearchButton').addEventListener('click', async () => {
            const origin = document.getElementById('origin').value;
            const date = document.getElementById('date').value;
            const method = document.querySelector('input[name="method"]:checked').value;
            const useCache = document.getElementById('useCache').checked;
            const useProxies = document.getElementById('useProxies').checked;

            if (!origin) {
                alert('Please select an origin airport');
                return;
            }

            if (!date) {
                alert('Please select a departure date');
                return;
            }

            const resultsCard = document.getElementById('resultsCard');
            const resultsContent = document.getElementById('resultsContent');
            const searchButton = document.getElementById('searchButton');
            const bulkButton = document.getElementById('bulkSearchButton');

            // Show loading
            resultsCard.classList.add('show');
            resultsContent.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Searching all routes from ${airportsData[origin]} (${origin})...</p>
                    <p style="font-size: 0.9rem; color: #666; margin-top: 10px;">
                        This may take several minutes. Processing ${routesData[origin]?.length || 0} destinations with ${useCache ? 'cache enabled' : 'fresh data'}${useProxies ? ' (proxy rotation enabled)' : ''}...
                    </p>
                </div>
            `;
            searchButton.disabled = true;
            bulkButton.disabled = true;

            try {
                const response = await fetch('/api/search-bulk', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        origin,
                        date,
                        method,
                        useCache,
                        useProxies
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Bulk search failed');
                }

                displayBulkResults(data, origin, date);

            } catch (error) {
                resultsContent.innerHTML = `
                    <div class="error-message">
                        <strong>Error:</strong>
                        ${error.message}
                    </div>
                `;
            } finally {
                searchButton.disabled = false;
                bulkButton.disabled = false;
            }
        });

        // Form submission
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const date = document.getElementById('date').value;
            const method = document.querySelector('input[name="method"]:checked').value;
            const useCache = document.getElementById('useCache').checked;
            const useProxies = document.getElementById('useProxies').checked;

            const resultsCard = document.getElementById('resultsCard');
            const resultsContent = document.getElementById('resultsContent');
            const searchButton = document.getElementById('searchButton');

            // Show loading
            resultsCard.classList.add('show');
            resultsContent.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Searching for flights from ${origin} to ${destination}...</p>
                </div>
            `;
            searchButton.disabled = true;

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        origin,
                        destination,
                        date,
                        method,
                        useCache,
                        useProxies
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Search failed');
                }

                displayResults(data, origin, destination, date);

            } catch (error) {
                resultsContent.innerHTML = `
                    <div class="error-message">
                        <strong>Error:</strong>
                        ${error.message}
                    </div>
                `;
            } finally {
                searchButton.disabled = false;
            }
        });

        function displayResults(data, origin, destination, date) {
            const resultsContent = document.getElementById('resultsContent');
            const { flights, cached, cachedAt, error } = data;

            const originCity = airportsData[origin] || origin;
            const destCity = airportsData[destination] || destination;

            let html = `
                <div class="results-header">
                    <h2>
                        ${originCity} (${origin}) → ${destCity} (${destination}) on ${date}
                        ${cached ? '<span class="cache-badge">CACHED</span>' : ''}
                    </h2>
                    <div class="results-meta">
                        ${flights.length} flight${flights.length !== 1 ? 's' : ''} found
                        ${cached ? ` • Cached at ${new Date(cachedAt).toLocaleString()}` : ''}
                    </div>
                </div>
            `;

            if (error) {
                html += `
                    <div class="error-message">
                        <strong>Warning:</strong>
                        ${error}
                    </div>
                `;
            }

            if (flights.length === 0) {
                html += `
                    <div class="no-flights">
                        <div class="no-flights-icon">😔</div>
                        <h3>No GoWild flights found</h3>
                        <p>Try a different date or route</p>
                    </div>
                `;
            } else {
                html += '<div class="flight-list">';

                flights.forEach(flight => {
                    html += `
                        <div class="flight-card">
                            <div class="flight-header">
                                <div class="flight-time">
                                    <span class="time">${flight.departure_time}</span>
                                    <span class="flight-arrow">→</span>
                                    <span class="time">${flight.arrival_time}</span>
                                </div>
                                <div class="flight-price">$${flight.price}</div>
                            </div>
                            <div class="flight-details">
                                <div class="detail-item">
                                    <span class="detail-label">Stops</span>
                                    <span class="detail-value">${flight.stops}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Duration</span>
                                    <span class="detail-value">${flight.duration || 'N/A'}</span>
                                </div>
                                <div class="detail-item">
                                    <span class="detail-label">Availability</span>
                                    <span class="detail-value">${flight.available ? '✅ Available' : '❌ Sold Out'}</span>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += '</div>';
            }

            resultsContent.innerHTML = html;
        }

        function displayBulkResults(data, origin, date) {
            const resultsContent = document.getElementById('resultsContent');
            const { totalRoutes, totalFlights, cached, scraped, errors, results } = data;

            const originCity = airportsData[origin] || origin;

            // Group results by destination
            const routesWithFlights = results.filter(r => r.flights.length > 0);
            const routesWithoutFlights = results.filter(r => r.flights.length === 0 && !r.error);
            const routesWithErrors = results.filter(r => r.error);

            let html = `
                <div class="results-header">
                    <h2>All Routes from ${originCity} (${origin}) on ${date}</h2>
                    <div class="results-meta">
                        ${totalRoutes} routes checked • ${totalFlights} total flights found<br>
                        ${cached} from cache • ${scraped} freshly scraped • ${errors} errors
                    </div>
                </div>
            `;

            // Show routes with flights
            if (routesWithFlights.length > 0) {
                html += `<h3 style="margin: 20px 0 10px; color: #333;">Routes with Available Flights (${routesWithFlights.length})</h3>`;
                html += '<div class="flight-list">';

                routesWithFlights.forEach(route => {
                    const destCity = airportsData[route.destination] || route.destination;
                    const cacheStatus = route.cached ? '<span class="cache-badge">CACHED</span>' : '';

                    html += `
                        <div class="flight-card">
                            <div style="margin-bottom: 15px; padding-bottom: 10px; border-bottom: 2px solid #e0e0e0;">
                                <h4 style="color: #667eea; font-size: 1.2rem;">
                                    ${origin} → ${destCity} (${route.destination}) ${cacheStatus}
                                </h4>
                                <div style="color: #666; font-size: 0.9rem;">${route.flights.length} flight${route.flights.length !== 1 ? 's' : ''} found</div>
                            </div>
                    `;

                    route.flights.forEach(flight => {
                        html += `
                            <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #f0f0f0;">
                                <div class="flight-time">
                                    <span class="time" style="font-size: 1.2rem;">${flight.departure_time}</span>
                                    <span class="flight-arrow">→</span>
                                    <span class="time" style="font-size: 1.2rem;">${flight.arrival_time}</span>
                                </div>
                                <div style="text-align: right;">
                                    <div class="flight-price" style="font-size: 1.5rem;">$${flight.price}</div>
                                    <div style="font-size: 0.85rem; color: #666;">${flight.stops} • ${flight.duration || 'N/A'}</div>
                                </div>
                            </div>
                        `;
                    });

                    html += '</div>';
                });

                html += '</div>';
            }

            // Show routes without flights
            if (routesWithoutFlights.length > 0) {
                html += `
                    <details style="margin: 20px 0;">
                        <summary style="cursor: pointer; padding: 10px; background: #f5f5f5; border-radius: 8px; font-weight: 600;">
                            Routes with No Flights (${routesWithoutFlights.length})
                        </summary>
                        <div style="padding: 10px; font-size: 0.9rem; color: #666;">
                            ${routesWithoutFlights.map(r => `${origin} → ${airportsData[r.destination]} (${r.destination})`).join(', ')}
                        </div>
                    </details>
                `;
            }

            // Show errors
            if (routesWithErrors.length > 0) {
                html += `
                    <details style="margin: 20px 0;">
                        <summary style="cursor: pointer; padding: 10px; background: #fee; border: 1px solid #fcc; border-radius: 8px; font-weight: 600; color: #c33;">
                            Routes with Errors (${routesWithErrors.length})
                        </summary>
                        <div style="padding: 10px; font-size: 0.9rem;">
                `;

                routesWithErrors.forEach(r => {
                    html += `
                        <div style="padding: 5px 0; border-bottom: 1px solid #fdd;">
                            <strong>${origin} → ${airportsData[r.destination]} (${r.destination}):</strong>
                            <span style="color: #c33;">${r.error}</span>
                        </div>
                    `;
                });

                html += '</div></details>';
            }

            if (totalFlights === 0 && errors === 0) {
                html += `
                    <div class="no-flights">
                        <div class="no-flights-icon">😔</div>
                        <h3>No GoWild flights found</h3>
                        <p>No flights available on any route from ${originCity} on ${date}</p>
                    </div>
                `;
            }

            resultsContent.innerHTML = html;
        }
    </script>
</body>
</html>
