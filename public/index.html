<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frontier GoWild Flight Scraper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }

        .form-group select,
        .form-group input {
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .options-group {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .option-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .option-item label {
            font-weight: 500;
            color: #555;
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e0e0e0;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
            font-weight: 600;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            display: none;
        }

        .results-card.active {
            display: block;
        }

        .results-header {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #e0e0e0;
        }

        .results-header h2 {
            color: #333;
            margin-bottom: 5px;
        }

        .results-meta {
            color: #666;
            font-size: 0.9em;
        }

        .flight-card {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        .flight-card:hover {
            border-color: #667eea;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.2);
        }

        .flight-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .flight-route {
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 1.2em;
            font-weight: 600;
        }

        .flight-arrow {
            color: #667eea;
        }

        .flight-price {
            font-size: 1.5em;
            font-weight: 700;
            color: #667eea;
        }

        .flight-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            color: #666;
        }

        .flight-detail-item {
            display: flex;
            flex-direction: column;
        }

        .detail-label {
            font-size: 0.85em;
            color: #999;
            margin-bottom: 3px;
        }

        .detail-value {
            font-weight: 600;
            color: #333;
        }

        .no-results {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .no-results svg {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .error-message {
            background: #fee;
            border: 2px solid #fcc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #c33;
        }

        .success-message {
            background: #efe;
            border: 2px solid #cfc;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #3c3;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .badge-cached {
            background: #fff3cd;
            color: #856404;
        }

        .badge-fresh {
            background: #d4edda;
            color: #155724;
        }

        .badge-api {
            background: #d1ecf1;
            color: #0c5460;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>✈️ Frontier GoWild Scraper</h1>
            <p>Search for GoWild flight deals on Frontier Airlines</p>
        </div>

        <div class="search-card">
            <form id="searchForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="origin">Origin Airport</label>
                        <select id="origin" required>
                            <option value="">Select origin...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="destination">Destination Airport</label>
                        <select id="destination" required>
                            <option value="">Select destination...</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Travel Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="options-group">
                    <div class="option-item">
                        <input type="radio" id="methodDirect" name="method" value="direct" checked>
                        <label for="methodDirect">Direct Scraping</label>
                    </div>
                    <div class="option-item">
                        <input type="radio" id="methodApi" name="method" value="api">
                        <label for="methodApi">Browse.ai API</label>
                    </div>
                    <div class="option-item">
                        <input type="checkbox" id="useCache" checked>
                        <label for="useCache">Use cached data (if available)</label>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-primary">Search Flights</button>
                    <button type="button" class="btn-secondary" onclick="testBrowseAI()">Test Browse.ai</button>
                </div>
            </form>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Searching for flights...</p>
            </div>
        </div>

        <div class="results-card" id="results">
            <div class="results-header">
                <h2 id="resultsTitle">Search Results</h2>
                <div class="results-meta" id="resultsMeta"></div>
            </div>
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        // Load airports
        async function loadAirports() {
            try {
                const response = await fetch('/api/airports');
                const airports = await response.json();

                const originSelect = document.getElementById('origin');
                const destSelect = document.getElementById('destination');

                // Sort airports by code
                const sortedAirports = Object.entries(airports).sort((a, b) => a[0].localeCompare(b[0]));

                sortedAirports.forEach(([code, name]) => {
                    const option1 = new Option(`${code} - ${name}`, code);
                    const option2 = new Option(`${code} - ${name}`, code);
                    originSelect.add(option1);
                    destSelect.add(option2);
                });

                // Set default date to tomorrow
                const tomorrow = new Date();
                tomorrow.setDate(tomorrow.getDate() + 1);
                document.getElementById('date').value = tomorrow.toISOString().split('T')[0];
                document.getElementById('date').min = new Date().toISOString().split('T')[0];

            } catch (error) {
                console.error('Error loading airports:', error);
                alert('Error loading airports. Please refresh the page.');
            }
        }

        // Search flights
        document.getElementById('searchForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const origin = document.getElementById('origin').value;
            const destination = document.getElementById('destination').value;
            const date = document.getElementById('date').value;
            const method = document.querySelector('input[name="method"]:checked').value;
            const useCache = document.getElementById('useCache').checked;

            // Show loading
            document.getElementById('loading').classList.add('active');
            document.getElementById('results').classList.remove('active');
            document.querySelector('.btn-primary').disabled = true;

            try {
                const response = await fetch('/api/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        origin,
                        destination,
                        date,
                        method,
                        useCache
                    })
                });

                const data = await response.json();

                // Hide loading
                document.getElementById('loading').classList.remove('active');
                document.querySelector('.btn-primary').disabled = false;

                // Display results
                displayResults(data, origin, destination, date);

            } catch (error) {
                document.getElementById('loading').classList.remove('active');
                document.querySelector('.btn-primary').disabled = false;
                alert('Error searching flights: ' + error.message);
            }
        });

        // Display results
        function displayResults(data, origin, destination, date) {
            const resultsCard = document.getElementById('results');
            const resultsTitle = document.getElementById('resultsTitle');
            const resultsMeta = document.getElementById('resultsMeta');
            const resultsContent = document.getElementById('resultsContent');

            resultsCard.classList.add('active');

            // Set title
            resultsTitle.textContent = `${origin} → ${destination} on ${date}`;

            // Set meta info
            let metaHTML = `Found ${data.flights.length} flight(s)`;
            if (data.cached) {
                metaHTML += ` <span class="badge badge-cached">Cached</span>`;
                metaHTML += ` <small>(Cached at: ${new Date(data.cachedAt).toLocaleString()})</small>`;
            } else {
                metaHTML += ` <span class="badge badge-fresh">Fresh</span>`;
            }
            if (data.error) {
                metaHTML = `<div class="error-message">${data.error}</div>` + metaHTML;
            }
            resultsMeta.innerHTML = metaHTML;

            // Display flights
            if (data.flights.length === 0) {
                resultsContent.innerHTML = `
                    <div class="no-results">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
                        </svg>
                        <h3>No Flights Available</h3>
                        <p>No GoWild flights were found for this route on the selected date.</p>
                    </div>
                `;
            } else {
                resultsContent.innerHTML = data.flights.map(flight => `
                    <div class="flight-card">
                        <div class="flight-header">
                            <div class="flight-route">
                                <span>${flight.origin}</span>
                                <span class="flight-arrow">→</span>
                                <span>${flight.destination}</span>
                            </div>
                            <div class="flight-price">$${flight.price}</div>
                        </div>
                        <div class="flight-details">
                            <div class="flight-detail-item">
                                <span class="detail-label">Departure</span>
                                <span class="detail-value">${flight.departure_time}</span>
                            </div>
                            <div class="flight-detail-item">
                                <span class="detail-label">Arrival</span>
                                <span class="detail-value">${flight.arrival_time}</span>
                            </div>
                            <div class="flight-detail-item">
                                <span class="detail-label">Stops</span>
                                <span class="detail-value">${flight.stops || 'Unknown'}</span>
                            </div>
                            <div class="flight-detail-item">
                                <span class="detail-label">Method</span>
                                <span class="detail-value">
                                    <span class="badge ${flight.scrape_method === 'browseai' ? 'badge-api' : 'badge-fresh'}">
                                        ${flight.scrape_method}
                                    </span>
                                </span>
                            </div>
                        </div>
                    </div>
                `).join('');
            }
        }

        // Test Browse.ai connection
        async function testBrowseAI() {
            try {
                const response = await fetch('/api/test-browseai');
                const data = await response.json();

                if (data.success) {
                    alert(`Browse.ai connected successfully!\n\nAvailable robots: ${data.robots.length}\n\n` +
                          data.robots.map(r => `- ${r.name} (${r.id})`).join('\n'));
                } else {
                    alert('Browse.ai connection failed:\n' + data.error);
                }
            } catch (error) {
                alert('Error testing Browse.ai: ' + error.message);
            }
        }

        // Initialize
        loadAirports();
    </script>
</body>
</html>
